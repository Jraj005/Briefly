[theme]
base = "dark"
primaryColor = "#1E90FF"
backgroundColor = "#0E1117"
secondaryBackgroundColor = "#1A1F2B"
textColor = "#FFFFFF"
font = "sans serif"

[client]
# Hides the "Deploy" button and developer menu items for a cleaner look
toolbarMode = "minimal"
showErrorDetails = false

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false
